name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript
        run: |
          node --check index.js
          node --check client.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements.txt

      - name: Check Python
        run: |
          python -m py_compile engine/svg_engine.py
          python -m py_compile tests/smoke_engine.py

      - name: Engine smoke test
        run: python tests/smoke_engine.py
